<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Name der Seite im Browser-Tab. Beim Wechsel in einen Bereich setzt
       die Seite diesen Titel selbst neu (siehe App.jsx, PAGE_TITLES). -->
  <title>TYPHEX WEBSTER — CARGO</title>

  <!-- Der Text, den Google und andere unter dem Link anzeigen. -->
  <meta name="description" content="The Official Typhex Webster website and store. Music, Art, Video, Shop." />

  <!-- Symbol im Tab und auf dem Startbildschirm. Bewusst freigestellt,
       ohne Hintergrund. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <meta name="theme-color" content="#000000" />

  <!-- Vorschau beim Teilen (WhatsApp, Discord, Instagram, Facebook …).
       Das Bild ist 1200 × 630 px. Zum Austauschen: eine neue Datei unter
       public/share-card.jpg ablegen, sonst nichts. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="TYPHEX WEBSTER — CARGO" />
  <meta property="og:title" content="TYPHEX WEBSTER — CARGO" />
  <meta property="og:description" content="The Official Typhex Webster website and store. Music, Art, Video, Shop." />
  <meta property="og:url" content="https://typhexwebster.com/" />
  <meta property="og:image" content="https://typhexwebster.com/share-card.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Dasselbe für X / Twitter. -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="TYPHEX WEBSTER — CARGO" />
  <meta name="twitter:description" content="The Official Typhex Webster website and store. Music, Art, Video, Shop." />
  <meta name="twitter:image" content="https://typhexwebster.com/share-card.jpg" />

  <link rel="canonical" href="https://typhexwebster.com/" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
